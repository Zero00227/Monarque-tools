            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Bordure animée Rouge et Bleu */
        .card { 
            position: relative;
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 15px; 
            max-width: 400px; 
            width: 90%;
            text-align: center;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        .card::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--accent-red), #111, var(--accent-blue), #111, var(--accent-red));
            background-size: 400%;
            z-index: -1;
            border-radius: 16px;
            animation: steam 15s linear infinite;
        }

        @keyframes steam {
            0% { background-position: 0% 0%; }
            50% { background-position: 400% 0%; }
            100% { background-position: 0% 0%; }
        }

        h1 { 
            font-size: 24px; 
            letter-spacing: 3px; 
            margin-bottom: 5px;
            color: #fff;
        }

        .subtitle {
            font-size: 10px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 18px; 
            background: var(--input-bg); 
            border: 1px solid #222; 
            color: #fff; 
            border-radius: 5px; 
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px var(--glow-blue); }

        .btn-group { display: flex; gap: 12px; margin-top: 10px; }

        button { 
            flex: 1; 
            padding: 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.4s;
        }

        .ban { 
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red); 
        }
        .ban:hover { 
            background: var(--accent-red); 
            color: #fff;
            box-shadow: 0 0 20px var(--glow-red);

        }

        .unban { 
            background: transparent;

            color: var(--accent-blue);
        }
        .unban:hover { 
            background: var(--accent-blue);

            box-shadow: 0 0 20px var(--glow-blue);
            transform: translateY(-2px);
