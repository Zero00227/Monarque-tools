<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONARQUE TOOLS - DARK JUSTICE</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #121212;
            --accent-red: #cc0000;
            --accent-green: #008844;
            --border-color: #222;
            --text-main: #e0e0e0;
            --input-bg: #181818;
            --neon-red: #ff0000;
            --neon-green: #00ff66;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card { 
            background: var(--card-bg); 
            border: 2px solid var(--accent-red); 
            padding: 40px; 
            border-radius: 12px; 
            max-width: 450px; 
            width: 100%;
            position: relative;
            overflow: hidden;
            /* Animation du contour néon de la carte qui alterne entre rouge et vert */
            animation: neon-border-glow 4s infinite ease-in-out;
        }

        /* Animation néon pour le contour complet de la carte */
        @keyframes neon-border-glow {
            0%, 100% {
                border-color: var(--neon-red);
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.2);
            }
            50% {
                border-color: var(--neon-green);
                box-shadow: 0 0 20px rgba(0, 255, 102, 0.4), inset 0 0 10px rgba(0, 255, 102, 0.2);
            }
        }

        h1 { 
            color: #fff; 
            font-size: 26px; 
            letter-spacing: 3px; 
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 10px;
            color: #555;
            letter-spacing: 4px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        label {
            display: block;
            text-align: left;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            margin-left: 2px;
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            background: var(--input-bg); 
            border: 1px solid #252525; 
            color: #fff; 
            border-radius: 6px; 
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, select:focus {
            border-color: #444;
        }

        .btn-group { display: flex; gap: 15px; margin-top: 10px; }

        button { 
            flex: 1; 
            padding: 15px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            border-radius: 6px; 
            font-size: 14px;
            font-weight: 800; 
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        /* Bouton BAN avec effet néon rouge clignotant */
        .ban { 
            background: rgba(204, 0, 0, 0.1); 
            color: #fff; 
            border-color: var(--neon-red);
            animation: neon-ban-pulse 2s infinite ease-in-out;
        }
        .ban:hover { 
            background: var(--neon-red); 
            box-shadow: 0 0 25px var(--neon-red);
            transform: translateY(-2px); 
        }

        /* Bouton UNBAN avec effet néon vert clignotant */
        .unban { 
            background: rgba(0, 136, 68, 0.1); 
            color: #fff; 
            border-color: var(--neon-green);
            animation: neon-unban-pulse 2s infinite ease-in-out;
        }
        .unban:hover { 
            background: var(--neon-green); 
            color: #000;
            box-shadow: 0 0 25px var(--neon-green);
            transform: translateY(-2px); 
        }

        /* Animations individuelles de clignotement pour les boutons */
        @keyframes neon-ban-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.3); border-color: rgba(255, 0, 0, 0.6); }
            50% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.8); border-color: var(--neon-red); }
        }

        @keyframes neon-unban-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 102, 0.3); border-color: rgba(0, 255, 102, 0.6); }
            50% { box-shadow: 0 0 15px rgba(0, 255, 102, 0.8); border-color: var(--neon-green); }
        }

        .footer-text { font-size: 11px; color: #333; margin-top: 30px; font-style: italic; }
        #apiStatus { font-size: 11px; text-align: center; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>MONARQUE TOOLS</h1>
        <div class="subtitle">SYSTEM ADMINISTRATION</div>
        
        <label>NUMÉRO DE LA CIBLE</label>
        <input type="text" id="targetNumber" placeholder="+227XXXXXXXX">
        
        <label>SÉLECTIONNER LE SCRIPT</label>
        <select id="reason">
            <option value="">-- CHOISIR UNE ACTION --</option>
            <option value="SCRIPT1">BAN : Activités Illégales (Script 1)</option>
            <option value="SCRIPT2">BAN : Maraboutage/Spam Polonais (Script 2)</option>
            <option value="UNBAN">UNBAN : Demande de réactivation</option>
        </select>

        <div class="btn-group">
            <button class="ban" onclick="processAction('BAN')">Exécuter Ban</button>
            <button class="unban" onclick="processAction('UNBAN')">Requête Unban</button>
        </div>
        
        <div id="apiStatus"></div>
        
        <div class="footer-text">Propriété exclusive du Monarque. Toute utilisation est tracée.</div>
    </div>

    <script>
        const API_URL = '/api/signaler';

        async function enregistrerSignalement(number, reason, actionType) {
            const statusDiv = document.getElementById('apiStatus');
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        numero: number, 
                        motif: `${actionType} - ${reason}`,
                        utilisateur: "MonarqueAdmin"
                    })
                });
                const data = await response.json();
                if(data.success) {
                    statusDiv.style.color = actionType === 'BAN' ? '#ff0000' : '#00ff66';
                    statusDiv.innerText = `[BASE DE DONNÉES] Enregistré. Total signalements : ${data.total}`;
                    statusDiv.style.display = 'block';
                }
            } catch (err) {
                console.error("Échec de la communication Vercel API.", err);
                statusDiv.style.color = '#555';
                statusDiv.innerText = "[ALERTE] Connexion API indisponible. Envoi direct de la requête...";
                statusDiv.style.display = 'block';
            }
        }

        function processAction(type) {
            const number = document.getElementById('targetNumber').value.trim();
            const reason = document.getElementById('reason').value;

            if (!number) {
                alert("Veuillez entrer un numéro.");
                return;
            }
            if (!reason) {
                alert("Veuillez sélectionner un script.");
                return;
            }

            if (type === 'BAN' && reason === 'UNBAN') {
                alert("Erreur : Script d'UNBAN sélectionné pour une action de BAN.");
                return;
            }
            if (type === 'UNBAN' && reason !== 'UNBAN') {
                alert("Erreur : Script de BAN sélectionné pour une action d'UNBAN.");
                return;
            }

            let subject = "";
            let message = "";

            if (type === 'BAN') {
                subject = "Report Urgent: Safety Violation";
                
                if (reason === 'SCRIPT1') {
                    message = `Hello WhatsApp Support Team,\n\n I am sending this urgent report regarding the WhatsApp account linked to the number ${number}. This account is engaging in extremely dangerous and illegal activities, and immediate action is required to protect other users.\n\nEven though I currently do not have direct evidence, the following behaviors make this account a serious threat:\n\n1. Selling illegal goods or services.\n2. Sharing shocking and disturbing content.\n3. Using offensive, threatening, and abusive language.\n4. High-risk activity violating WhatsApp policies.\n\nI strongly request an immediate suspension of this account. Thank you.`;
                } 
                else if (reason === 'SCRIPT2') {
                    const cleanNum = number.replace('+', '');
                    const polishText = `Możesz także zalogować się na swoje konto WhatsApp. Więcej informacji - zapraszamy do skorzystania. dzieci. Na filmie widać od 6 do 8 telefonów. Przez większość czasu w domu jest dużo pieniędzy. Jest już za późno, aby dowiedzieć się, co się dzieje. W sklepie jest mnóstwo pieniędzy i jeszcze więcej. Można go także pobrać z WhatsApp. Dużo informacji można uzyskać na telefonie i przez telefon. . Możesz go użyć po raz premierowy. \nhttps://whatsapp.com{cleanNum}`;
                    message = polishText + "\n\n" + polishText;
                }
            } else {
                subject = "Account Recovery Request";
                message = `Hello,\n\nMy WhatsApp account ${number} has been disabled. I have not violated any terms. Please review and reactivate my account. Thank you.`;
            }

            enregistrerSignalement(number, reason, type);

            const mailtoLink = `mailto:support@://whatsapp.com{encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
            
            setTimeout(() => {
                window.location.href = mailtoLink;
            }, 400);
        }
    </script>
</body>
</html>
