<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONARQUE TOOLS - DARK JUSTICE</title>
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: #0d0d0d;
            --accent-red: #ff0000;
            --accent-blue: #007bff;
            --text-gray: #888;
            --input-bg: #151515;
            --glow-red: rgba(255, 0, 0, 0.5);
            --glow-blue: rgba(0, 123, 255, 0.5);
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: 'Inter', -apple-system, sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card { 
            position: relative;
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 15px; 
            max-width: 400px; 
            width: 90%;
            text-align: center;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        .card::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--accent-red), #111, var(--accent-blue), #111, var(--accent-red));
            background-size: 400%;
            z-index: -1;
            border-radius: 16px;
            animation: steam 15s linear infinite;
        }

        @keyframes steam {
            0% { background-position: 0% 0%; }
            50% { background-position: 400% 0%; }
            100% { background-position: 0% 0%; }
        }

        h1 { 
            font-size: 24px; 
            letter-spacing: 3px; 
            margin-bottom: 5px;
            color: #fff;
        }

        .subtitle {
            font-size: 10px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 18px; 
            background: var(--input-bg); 
            border: 1px solid #222; 
            color: #fff; 
            border-radius: 5px; 
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px var(--glow-blue); }

        .btn-group { display: flex; gap: 12px; margin-top: 10px; }

        button { 
            flex: 1; 
            padding: 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.4s;
        }

        .ban { 
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red); 
        }
        .ban:hover { 
            background: var(--accent-red); 
            color: #fff;
            box-shadow: 0 0 20px var(--glow-red);
            transform: translateY(-2px);
        }

        .unban { 
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
        }
        .unban:hover { 
            background: var(--accent-blue); 
            color: #fff;
            box-shadow: 0 0 20px var(--glow-blue);
            transform: translateY(-2px);
        }

        .footer { font-size: 9px; color: #333; margin-top: 30px; letter-spacing: 1px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <h1>𝕄𝕆ℕ𝔸ℝℚ𝕌𝔼 𝕋𝕆𝕆𝕃𝕊</h1>
        <div class="subtitle">Enforcement & Justice Division</div>
        
        <input type="text" id="targetNumber" placeholder="Numéro (ex: +22780828646)">
        
        <select id="reason">
            <option value="">-- SÉLECTIONNER UN SCRIPT --</option>
            <option value="SCRIPT1">BAN : Activités Illégales (Anglais)</option>
            <option value="SCRIPT2">BAN : Script Polonais (Multi-Device)</option>
            <option value="SCRIPT3">BAN : Spam & Risque Élevé</option>
            <option value="UNBAN">UNBAN : Demande de réactivation</option>
        </select>

        <div class="btn-group">
            <button class="ban" onclick="processAction('BAN')">BAN ACTION</button>
            <button class="unban" onclick="processAction('UNBAN')">UNBAN ACTION</button>
        </div>
        
        <div class="footer">
            Propriété du Monarque.<br>
            Usage réservé à la régulation des abus.<br>
            © 2026 DARK JUSTICE DIVISION
        </div>
    </div>

    <script>
        function processAction(type) {
            const number = document.getElementById('targetNumber').value.trim();
            const reason = document.getElementById('reason').value;

            if (!number || !reason) {
                alert("Veuillez remplir le numéro et choisir un script.");
                return;
            }

            let subject = "";
            let message = "";

            if (type === 'BAN') {
                subject = "Report: Violation of Terms of Service";
                
                if (reason === 'SCRIPT1') {
                    message = "Hello WhatsApp Support Team,\n\n" +
                    "ࣩ➣ I am sending this urgent report regarding the WhatsApp account linked to the number " + number + ". This account is engaging in extremely dangerous and illegal activities, and immediate action is required to protect other users.\n\n" +
                    "1. Selling illegal goods or services.\n" +
                    "2. Sharing shocking and disturbing content.\n" +
                    "3. Using offensive and abusive language.\n" +
                    "4. High-risk activity violating WhatsApp policies.\n\n" +
                    "I request an immediate suspension of this account. Thank you.";
                } 
                else if (reason === 'SCRIPT2') {
                    const polish = "Możesz także zalogować się na swoje konto WhatsApp. Więcej informacji - zapraszamy do skorzystania. dzieci. Na filmie widać od 6 do 8 telefonów. Przez większość czasu w domu jest dużo pieniędzy. Jest już za późno, aby dowiedzieć się, co się dzieje. W sklepie jest mnóstwo pieniędzy i jeszcze więcej. Można go także pobrać z WhatsApp. Dużo informacji można uzyskać na telefonie i przez telefon. . Możesz go użyć po raz premierze. 👇👇\nhttps://whatsapp.com" + number.replace('+', '');
                    message = polish + "\n\n" + polish;
                }
                else if (reason === 'SCRIPT3') {
                    message = "Urgent: This account " + number + " is distributing prohibited content and spamming high-risk links. Multiple violations of community safety guidelines detected. he said he is a pedophile love sex with ten girl and kill her for sacrifice. he love sex and do it every day via WhatsApp but WhatsApp did not pay attention to this because it doesn't have the sensibility to discover what's inside it and what he doing from her secret link https://www.xnxx.com/video-dvjue3c/oily_busty_slut_slammed_after_sucking_big_dick_outdoors_in_hd and he said he had rough sex with girl only old 15 year and fuck her hard until she dead. look on link https://www.xnxx-tv.info/watch-N3OpNwuTrM/xnxx_Ryan_Conner_anal_with_bbc/ and watch the video. Account termination requested immediately.";
                }
            } else {
                subject = "Account Recovery Request";
                message = "Hello,\n\nMy WhatsApp account " + number + " has been disabled. I apologise for inadvertently violating the terms of service. I have now reviewed them thoroughly and will ensure full compliance moving forward. I kindly request the restoration of my account My WhatsApp Account Has Banned From Using WhatsApp By Mistake. Please Unbanned My WhatsApp Number Immediately. Because I'm Studying Online Class In WhatsApp. So I Need My WhatsApp Number Very Emergency. Please My Public Exam Is Coming Soon...I Hope You Understand My Situation My WhatsApp number+227. Please review and reactivate my account. Thank you.";
            }

            const mailtoLink = "mailto:support@whatsapp.com" +
                "?subject=" + encodeURIComponent(subject) +
                "&body=" + encodeURIComponent(message);

            window.location.href = mailtoLink;
        }
    </script>

</body>
</html>
