<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONARQUE TOOLS - DARK JUSTICE</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #121212;
            --accent-red: #cc0000;
            --accent-green: #008844;
            --border-color: #222;
            --text-main: #e0e0e0;
            --input-bg: #181818;
            --neon-red: #ff0000;
            --neon-green: #00ff66;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card { 
            background: var(--card-bg); 
            border: 2px solid var(--accent-red); 
            padding: 30px; 
            border-radius: 12px; 
            max-width: 450px; 
            width: 100%;
            position: relative;
            overflow: hidden;
            animation: neon-border-glow 4s infinite ease-in-out;
            box-sizing: border-box;
        }

        @keyframes neon-border-glow {
            0%, 100% {
                border-color: var(--neon-red);
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.2);
            }
            50% {
                border-color: var(--neon-green);
                box-shadow: 0 0 20px rgba(0, 255, 102, 0.4), inset 0 0 10px rgba(0, 255, 102, 0.2);
            }
        }

        h1 { 
            color: #fff; 
            font-size: 24px; 
            letter-spacing: 3px; 
            margin-bottom: 5px;
            text-transform: uppercase;
            text-align: center;
        }

        .subtitle {
            font-size: 10px;
            color: #555;
            letter-spacing: 4px;
            margin-bottom: 30px;
            font-weight: bold;
            text-align: center;
        }

        label {
            display: block;
            text-align: left;
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
            margin-left: 2px;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: var(--input-bg); 
            border: 1px solid #252525; 
            color: #fff; 
            border-radius: 6px; 
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #444;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn-group { display: flex; gap: 15px; margin-top: 10px; }

        button { 
            flex: 1; 
            padding: 14px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            border-radius: 6px; 
            font-size: 12px;
            font-weight: 800; 
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .ban { 
            background: rgba(204, 0, 0, 0.1); 
            color: #fff; 
            border-color: var(--neon-red);
            animation: neon-ban-pulse 2s infinite ease-in-out;
        }
        .ban:hover { background: var(--neon-red); }

        .unban { 
            background: rgba(0, 136, 68, 0.1); 
            color: #fff; 
            border-color: var(--neon-green);
            animation: neon-unban-pulse 2s infinite ease-in-out;
        }
        .unban:hover { background: var(--neon-green); color: #000; }

        @keyframes neon-ban-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.3); border-color: rgba(255, 0, 0, 0.6); }
            50% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.8); border-color: var(--neon-red); }
        }

        @keyframes neon-unban-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 102, 0.3); border-color: rgba(0, 255, 102, 0.6); }
            50% { box-shadow: 0 0 15px rgba(0, 255, 102, 0.8); border-color: var(--neon-green); }
        }

        /* Boite d'affichage de secours pour smartphone */
        .output-box {
            display: none;
            background: #151515;
            border: 1px dashed #333;
            padding: 15px;
            margin-top: 20px;
            border-radius: 6px;
        }
        .output-box label { color: var(--neon-green); font-weight: bold; }
        
        .script-preview {
            background: #000;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            border: 1px solid #222;
        }

        .send-btn {
            background: #fff;
            color: #000;
            width: 100%;
            border-radius: 6px;
            padding: 12px;
            font-weight: bold;
            border: none;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            font-size: 13px;
        }

        .footer-text { font-size: 11px; color: #333; margin-top: 30px; font-style: italic; text-align: center; }
        #apiStatus { font-size: 11px; text-align: center; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>MONARQUE TOOLS</h1>
        <div class="subtitle">SYSTEM ADMINISTRATION</div>
        
        <label>NUMÉRO DE LA CIBLE</label>
        <input type="text" id="targetNumber" placeholder="+227XXXXXXXX">
        
        <label>SÉLECTIONNER LE SCRIPT</label>
        <select id="reason">
            <option value="">-- CHOISIR UNE ACTION --</option>
            <option value="SCRIPT1">BAN : Abus de service et Spam</option>
            <option value="SCRIPT2">BAN : Usurpation d'identité et Harcèlement</option>
            <option value="UNBAN">UNBAN : Demande de réactivation</option>
        </select>

        <label>ÉLÉMENTS OU PREUVES (OPTIONNEL)</label>
        <textarea id="evidence" placeholder="Ex: Group links, timestamps..."></textarea>

        <div class="btn-group">
            <button class="ban" onclick="processAction('BAN')">Générer Ban</button>
            <button class="unban" onclick="processAction('UNBAN')">Générer Unban</button>
        </div>
        
        <div id="apiStatus"></div>

        <!-- Section de secours visible si Gmail bloque le contenu -->
        <div id="outputBox" class="output-box">
            <label>SUJET DU MAIL :</label>
            <div id="subjectPreview" class="script-preview" style="color: #ff0000; font-weight: bold;"></div>
            
            <label>TEXTE DU SCRIPT (COPIÉ AUTOMATIQUEMENT) :</label>
            <textarea id="bodyPreview" style="min-height: 100px; background: #000; font-size: 12px;" readonly></textarea>
            
            <a id="mailButton" class="send-btn" href="#">1. Ouvrir Gmail</a>
        </div>
        
        <div class="footer-text">Propriété exclusive du Monarque. Toute utilisation est tracée.</div>
    </div>

    <script>
        function processAction(type) {
            const number = document.getElementById('targetNumber').value.trim();
            const reason = document.getElementById('reason').value;
            const evidence = document.getElementById('evidence').value.trim();
            const statusDiv = document.getElementById('apiStatus');
            const outputBox = document.getElementById('outputBox');
            const subjectPreview = document.getElementById('subjectPreview');
            const bodyPreview = document.getElementById('bodyPreview');
            const mailButton = document.getElementById('mailButton');

            if (!number) { alert("Veuillez entrer un numéro."); return; }
            if (!reason) { alert("Veuillez sélectionner un script."); return; }

            if (type === 'BAN' && reason === 'UNBAN') { alert("Erreur de cohérence."); return; }
            if (type === 'UNBAN' && reason !== 'UNBAN') { alert("Erreur de cohérence."); return; }

            let subject = "";
            let message = "";
            let evidenceText = evidence ? `\nAdditional Context/Evidence:\n${evidence}` : "";

            if (type === 'BAN') {
                if (reason === 'SCRIPT1') {
                    subject = "Urgent: Systematic Abuse and Spam Report";
                    message = `Dear Support Team,\n\nI am writing to formally report a persistent violation of your Terms of Service associated with the mobile number ${number}.\n\nThis account has been repeatedly broadcasting automated, unsolicited messages and spam networks.\n\n${evidenceText}\n\nWe kindly request your automated systems to take appropriate restrictive action.\n\nSincerely.`;
                } 
                else if (reason === 'SCRIPT2') {
                    subject = "Safety Report: Impersonation and Harassment";
                    message = `Dear Support Team,\n\nThis is an urgent safety report regarding the account operating under the number ${number}.\n\nThis user is currently engaged in malicious activities, including targeted harassment.\n\n${evidenceText}\n\nWe urge an immediate review and suspension.\n\nThank you.`;
                }
            } else {
                subject = "Appeals: Account Suspension Review Request";
                message = `Dear Support Team,\n\nMy mobile number ${number} has been recently suspended.\n\nI believe this restriction was applied in error. I strictly adhere to all Terms of Service.\n\n${evidenceText}\n\nPlease re-examine the recent activity logs.\n\nRegards.`;
