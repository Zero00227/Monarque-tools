<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONARQUE TOOLS - DARK JUSTICE</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #121212;
            --accent-red: #cc0000;
            --accent-green: #008844;
            --text-gray: #b0b0b0;
            --input-bg: #1a1a1a;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: 'Inter', -apple-system, sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid #222; 
            padding: 30px; 
            border-radius: 15px; 
            max-width: 400px; 
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 { 
            font-size: 22px; 
            letter-spacing: 2px; 
            margin-bottom: 5px;
            color: #fff;
        }

        .subtitle {
            font-size: 9px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: var(--input-bg); 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 8px; 
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }

        button { 
            flex: 1; 
            padding: 14px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }

        .ban { background: var(--accent-red); color: #fff; }
        .ban:hover { background: #ff0000; transform: scale(1.02); }

        .unban { background: var(--accent-green); color: #fff; }
        .unban:hover { background: #00bb55; transform: scale(1.02); }

        .footer { font-size: 10px; color: #444; margin-top: 25px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>𝕄𝕆ℕ𝔸ℝℚ𝕌𝔼 𝕋𝕆𝕆𝕃𝕊</h1>
        <div class="subtitle">Enforcement & Justice Division</div>
        
        <input type="text" id="targetNumber" placeholder="Numéro (ex: +22780828646)">
        
        <select id="reason">
            <option value="">-- SÉLECTIONNER UN SCRIPT --</option>
            <option value="SCRIPT1">BAN : Activités Illégales (Anglais)</option>
            <option value="SCRIPT2">BAN : Script Polonais (Multi-Device)</option>
            <option value="UNBAN">UNBAN : Demande de réactivation</option>
        </select>

        <div class="btn-group">
            <button class="ban" onclick="processAction('BAN')">BAN ACTION</button>
            <button class="unban" onclick="processAction('UNBAN')">UNBAN ACTION</button>
        </div>
        
        <div class="footer">
            Propriété du Monarque.<br>
            Usage réservé à la régulation des abus.
        </div>
    </div>

    <script>
        function processAction(type) {
            const number = document.getElementById('targetNumber').value.trim();
            const reason = document.getElementById('reason').value;

            if (!number || !reason) {
                alert("Veuillez remplir le numéro et choisir un script.");
                return;
            }

            let subject = "";
            let message = "";

            if (type === 'BAN') {
                subject = "Report: Violation of Terms of Service";
                
                if (reason === 'SCRIPT1') {
                    message = "Hello WhatsApp Support Team,\n\n" +
                    "ࣩ➣ I am sending this urgent report regarding the WhatsApp account linked to the number " + number + ". This account is engaging in extremely dangerous and illegal activities, and immediate action is required to protect other users.\n\n" +
                    "1. Selling illegal goods or services.\n" +
                    "2. Sharing shocking and disturbing content.\n" +
                    "3. Using offensive and abusive language.\n" +
                    "4. High-risk activity violating WhatsApp policies.\n\n" +
                    "I request an immediate suspension of this account. Thank you.";
                } 
                else if (reason === 'SCRIPT2') {
                    const polish = "Możesz także zalogować się na swoje konto WhatsApp. Więcej informacji - zapraszamy do skorzystania. dzieci. Na filmie widać od 6 do 8 telefonów. Przez większość czasu w domu jest dużo pieniędzy. Jest już za późno, aby dowiedzieć się, co się dzieje. W sklepie jest mnóstwo pieniędzy i jeszcze więcej. Można go także pobrać z WhatsApp. Dużo informacji można uzyskać na telefonie i przez telefon. . Możesz go użyć po raz pierwszy. 👇👇\nhttps://whatsapp.com" + number.replace('+', '');
                    message = polish + "\n\n" + polish;
                }
            } else {
                subject = "Account Recovery Request";
                message = "Hello,\n\nMy WhatsApp account " + number + " has been disabled. I have not violated any terms. Please review and reactivate my account. Thank you.";
            }

            // Construction sécurisée du lien Mailto
            const mailtoLink = "mailto:support@://whatsapp.com" +
                "?subject=" + encodeURIComponent(subject) +
                "&body=" + encodeURIComponent(message);

            // Redirection vers l'application de mail
            window.location.href = mailtoLink;
        }
    </script>

</body>
</html>
